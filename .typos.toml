[default]
# Finding identifiers, attestation identifiers and digests are hexadecimal, not words.
extend-ignore-re = ["(acc|attestation):?-?[0-9a-f]{16}", "[0-9a-f]{40,64}"]

[default.extend-words]
# Rule and validation code prefixes.
acc = "acc"
acv = "acv"
# in-toto: the module name and the conventional `.intoto.json` attestation suffix.
intoto = "intoto"

[files]
extend-exclude = ["target/**", "tests/fixtures/**", "tests/snapshots/**", "conformance/accept/**", "conformance/reject/**", "conformance/incomplete/**", "conformance/MANIFEST.json", "conformance/CORPUS-DIGESTS.txt", "CHANGELOG.md", "Cargo.lock"]
