# Publish agent-change-control to crates.io with Trusted Publishing: the job exchanges its GitHub
# OIDC token for a short-lived crates.io token, so no long-lived CARGO_REGISTRY_TOKEN secret exists.
#
# Before this workflow can work:
#   1. The first publish must be done manually by a crate owner (`cargo publish --locked` with a
#      personal API token), because Trusted Publishing can only be configured on a crate that
#      already exists on crates.io.
#   2. Then, on crates.io, agent-change-control → Settings → Trusted Publishing, add a GitHub
#      publisher: owner noru-tech, repository agent-change-control, workflow publish-crate.yml,
#      environment left empty.
#
# Trigger note: a release created by release.yml with the default GITHUB_TOKEN does not start
# other workflows, so `release: published` fires only for releases published by a person (or a
# token other than GITHUB_TOKEN). For a dist-created release, run this workflow by hand with the
# tag (Actions → publish-crate → Run workflow, or `gh workflow run publish-crate.yml -f tag=vX.Y.Z`).
name: publish-crate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.5.2)
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-crate
  cancel-in-progress: false

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09
        with:
          toolchain: stable
      - name: The tag names the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agent-change-control") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
