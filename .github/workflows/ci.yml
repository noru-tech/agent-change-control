name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --all-features
      - name: smoke-test the binary
        run: |
          cargo run -q -- evaluate tests/fixtures/claude-clean/events.json --format table
          cargo run -q -- validate tests/fixtures/human-clean/expected-manifest.json
          cargo run -q -- check tests/fixtures/human-self-approved/expected-manifest.json || test $? -eq 1

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  jcs:
    # Spec §8.2: every digest is SHA-256 over RFC 8785 bytes. Recompute the goldens' digests
    # with an independent JCS implementation, without any of acc's code.
    name: RFC 8785 cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install --require-hashes -r .github/scripts/jcs-requirements.txt
      - run: .venv/bin/python .github/scripts/jcs_crosscheck.py tests/fixtures

  conformance:
    # Spec §9: acc must pass the evaluator conformance corpus it publishes, through the same
    # external-verifier contract and one-step action any other implementation uses.
    name: conformance corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked
      - name: The digest list matches the files on disk
        run: python3 conformance/digests.py --check
      - name: Run the corpus against acc
        uses: ./conformance
        with:
          verifier: target/debug/acc evaluate --conformance-json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: conformance-report.json

  conformance-broken:
    # A corpus that a broken evaluator also passes proves nothing. Break one thing at a time
    # and require the corpus to fail.
    name: conformance catches ${{ matrix.break }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        break: [ACC001, ACC002, ACC003, ACC004, ACC005, ACC006, ACC008, ACC010, serialization]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: python3 .github/scripts/break_evaluator.py ${{ matrix.break }}
      - run: cargo build --locked
      - name: The corpus must fail
        run: |
          if python3 conformance/run.py --verifier "target/debug/acc evaluate --conformance-json" --report broken.json; then
            echo "::error::the corpus passed an evaluator with ${{ matrix.break }} broken"
            exit 1
          fi
          python3 -c "import json; t = json.load(open('broken.json'))['totals']; assert t['fail'] + t['error'] > 0; print(t)"
