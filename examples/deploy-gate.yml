# Deploy only what passed change control.
#
# A sketch of a production deploy workflow that runs `acc verify` before deploying. It assumes the
# signing workflow from docs/signing.md, with the upload step from docs/verify.md, so that every
# merged pull request left an artifact `acc-verdict-<merge commit>` holding its attested manifest.
#
# Replace OWNER/REPO, the signer and the deploy step. Pin every action to a commit SHA, and the acc
# release to a version you have verified (README, "Verify before you run").
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: The commit deployed last, for the first deploy or to override the record
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read        # find and download the verdict artifacts
      attestations: read   # gh attestation verify
      deployments: read    # the last successful deployment
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNER: https://github.com/OWNER/REPO/.github/workflows/attest.yml@refs/heads/main
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # acc verify refuses a shallow clone

      - name: Install acc
        run: |
          set -euo pipefail
          VERSION=vX.Y.Z   # a release with acc verify, verified as below
          ARCHIVE=agent-change-control-x86_64-unknown-linux-musl.tar.xz
          gh release download "$VERSION" --repo noru-tech/agent-change-control \
            --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256"
          gh attestation verify "$ARCHIVE" --repo noru-tech/agent-change-control \
            --signer-workflow noru-tech/agent-change-control/.github/workflows/release.yml
          sha256sum -c "$ARCHIVE.sha256"
          mkdir -p "$RUNNER_TEMP/acc"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP/acc" --strip-components=1
          echo "$RUNNER_TEMP/acc" >> "$GITHUB_PATH"

      - name: Find the last successful production deployment
        id: base
        env:
          OVERRIDE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          base="$OVERRIDE"
          if [ -z "$base" ]; then
            for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=production&per_page=30" --jq '.[].id'); do
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
              if [ "$state" = "success" ]; then
                base=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq '.sha')
                break
              fi
            done
          fi
          if [ -z "$base" ]; then
            echo "::error::no successful production deployment found; run once with the base input"
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Verify the verdict of every change being deployed
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$(git rev-list --first-parent "$BASE..$GITHUB_SHA")" ]; then
            echo "nothing new since $BASE"
            exit 0
          fi
          mkdir -p verdicts
          for sha in $(git rev-list --first-parent "$BASE..$GITHUB_SHA"); do
            name="acc-verdict-$sha"
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=1" \
              --jq '.artifacts[0].workflow_run.id // empty')
            # No verdict: acc verify reports this commit uncovered and fails below.
            [ -n "$run" ] || continue
            gh run download "$run" --name "$name" --dir "verdicts/$sha"
            gh attestation verify "verdicts/$sha/acc-manifest.json" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/attest.yml" \
              --predicate-type https://noru.tech/spec/ai-change-provenance/v0.4 \
              --format json > "verdicts/$sha.json"
          done
          set -- verdicts/*.json
          args=()
          [ -e "$1" ] && for f in "$@"; do args+=(--verification "$f"); done
          acc verify --range "$BASE..$GITHUB_SHA" "${args[@]}" \
            --signer "$SIGNER" --issuer https://token.actions.githubusercontent.com \
            --format json --output acc-verify.json \
            || { cat acc-verify.json; exit 1; }

      - name: Deploy
        run: echo "deploy $GITHUB_SHA here"
